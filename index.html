<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QasinoTok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    /* ============================================================
       QASINOTOK — БІРІКТІРІЛГЕН CSS
       ============================================================ */
    :root {
      --bg: #000; --surface: #121212; --surface-2: #1c1c1e;
      --text: #fff; --text-dim: #a1a1aa;
      --accent: #fe2c55; --accent-2: #25f4ee;
      --topbar-h: 56px; --bottomnav-h: 60px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    input, textarea, select { font-family: inherit; color: #000; }

    /* APP SHELL */
    #app { position: relative; width: 100%; height: 100dvh; overflow: hidden; }

    /* TOP BAR */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    }
    .brand { font-weight: 800; font-size: 20px; position: absolute; left: 50%; transform: translateX(-50%); text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .brand-q { color: var(--accent-2); } .brand-tok { color: var(--accent); }
    .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; transition: background 0.2s; color: #fff; }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .topbar-right { display: flex; gap: 4px; }

    /* MAIN & PAGES */
    #main { position: absolute; inset: 0; }
    .page { position: absolute; inset: 0; display: none; flex-direction: column; overflow-y: auto; padding-bottom: var(--bottomnav-h); }
    .page.active { display: flex; }

    /* FEED TABS */
    .feed-tabs { position: absolute; top: var(--topbar-h); left: 0; right: 0; display: flex; justify-content: center; gap: 22px; z-index: 50; padding: 6px 0; }
    .feed-tab { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.55); padding: 6px 2px; transition: color 0.2s; }
    .feed-tab.active { color: #fff; }
    .feed-tab.active::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 22px; height: 3px; background: #fff; border-radius: 2px; }

    /* VIDEO FEED */
    .video-feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; height: 100%; scrollbar-width: none; }
    .video-feed::-webkit-scrollbar { display: none; }
    .video-card { position: relative; height: 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; background: #000; }
    .video-card video { width: 100%; height: 100%; object-fit: contain; background: #000; }

    /* VIDEO OVERLAY & ACTIONS */
    .video-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%); }
    .video-actions { position: absolute; right: 10px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 10; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; }
    .action-btn svg { width: 32px; height: 32px; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5)); }
    .action-btn .count { font-size: 12px; font-weight: 600; }
    .action-btn.liked svg { fill: var(--accent); stroke: var(--accent); }
    .action-btn.liked .count { color: var(--accent); }
    .action-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }

    /* VIDEO INFO */
    .video-info { position: absolute; left: 14px; bottom: 20px; right: 80px; z-index: 10; color: #fff; }
    .video-author { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .video-author .author-name { font-weight: 700; font-size: 16px; }
    .video-caption { font-size: 14px; line-height: 1.35; margin-bottom: 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .video-caption .hashtag { color: var(--accent-2); font-weight: 600; }
    .video-music { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #fff; }
    .video-music svg { width: 14px; height: 14px; }

    /* PAGE HEADERS (Профиль, Жүктеу т.б.) */
    .page-header { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); background: var(--bg); position: sticky; top: 0; z-index: 20; }
    .page-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
    .back-btn { width: 38px; height: 38px; display: grid; place-items: center; font-size: 22px; }

    /* FORMS & BUTTONS */
    .btn-primary { background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 15px; width: 100%; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 15px; width: 100%; }
    .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; color: var(--text-dim); }
    .form-group input, .form-group textarea, .form-group select { padding: 12px; border-radius: 8px; border: none; outline: none; background: var(--surface-2); color: #fff; }
    
    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottomnav-h);
      background: rgba(10,10,10,0.95); backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: space-around; z-index: 90;
    }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim); font-size: 10px; font-weight: 600; padding: 6px 10px; }
    .nav-btn.active { color: #fff; }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-upload { justify-content: center; }
    .upload-plus { width: 44px; height: 30px; background: #fff; color: #000; font-size: 22px; font-weight: 700; border-radius: 8px; display: grid; place-items: center; line-height: 1; position: relative; }
    .upload-plus::before, .upload-plus::after { content: ''; position: absolute; background: var(--accent-2); border-radius: 2px; }
    .upload-plus::before { left: -4px; top: 4px; width: 4px; height: 22px; }
    .upload-plus::after { right: -4px; top: 4px; width: 4px; height: 22px; background: var(--accent); }

    /* PROFILE */
    .profile-info { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; background: #333; }
    .profile-stats { display: flex; justify-content: center; gap: 20px; margin: 15px 0; }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat strong { font-size: 18px; }
    .stat span { font-size: 12px; color: var(--text-dim); }
    .profile-actions { display: flex; gap: 10px; margin-top: 15px; }
    
    /* UPLOAD PAGE */
    .upload-wrap { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .upload-drop { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .upload-icon { width: 40px; height: 40px; color: var(--text-dim); }
    .upload-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
    .upload-preview video { width: 100%; max-height: 400px; border-radius: 12px; margin-bottom: 10px; object-fit: contain; background: #000; }
    
    /* OTHER PAGES (Messages, Trends) */
    .messages-list, .trends-list { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .trend-item { background: var(--surface-2); padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 5px; }
    .trend-item h3 { color: var(--accent-2); font-size: 16px; }

    /* TOAST */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(255,255,255,0.9); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 600; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="app">
    <!-- TOP BAR -->
    <header class="topbar">
      <button class="icon-btn" id="btnSearchToggle">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
      <div class="brand">
        <span class="brand-q">Q</span>asino<span class="brand-tok">Tok</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" data-page="upload">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" data-page="messages">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- БАСТЫ БЕТ (ЛЕНТА) -->
      <section class="page active" id="page-home">
        <div class="feed-tabs">
          <button class="feed-tab active">Ұсыныстар</button>
          <button class="feed-tab">Жазылымдар</button>
          <button class="feed-tab">Трендтер</button>
        </div>
        <div class="video-feed" id="videoFeed"></div>
      </section>

      <!-- ЖҮКТЕУ БЕТІ -->
      <section class="page" id="page-upload">
        <div class="page-header">
          <button class="back-btn" data-page="home">←</button>
          <h2>Видео жүктеу</h2>
        </div>
        <div class="upload-wrap">
          <div class="upload-drop">
            <svg viewBox="0 0 24 24" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p>Видео файлын таңдаңыз</p>
            <span class="upload-hint">MP4, WebM • 9:16 формат</span>
            <input type="file" id="videoFileInput" accept="video/*" hidden />
            <button class="btn-primary" id="btnPickFile">Файл таңдау</button>
          </div>
          <div class="upload-form">
            <div class="form-group">
              <label>Сипаттама</label>
              <textarea id="uploadCaption" rows="2" placeholder="Видео туралы... #хэштег"></textarea>
            </div>
            <button class="btn-primary" id="btnPublish">Жариялау</button>
          </div>
        </div>
      </section>

      <!-- ХАБАРЛАМАЛАР БЕТІ -->
      <section class="page" id="page-messages">
        <div class="page-header">
          <button class="back-btn" data-page="home">←</button>
          <h2>Хабарламалар</h2>
        </div>
        <div class="messages-list">
          <div class="trend-item"><h3>Qasino Admin</h3><p>Сайтқа қош келдіңіз! 🎉</p></div>
          <div class="trend-item"><h3>Жүйелік хабарлама</h3><p>Жаңа бейнелер қосылды.</p></div>
        </div>
      </section>

      <!-- ПРОФИЛЬ БЕТІ -->
      <section class="page" id="page-profile">
        <div class="page-header">
          <button class="back-btn" data-page="home">←</button>
          <h2>Профиль</h2>
        </div>
        <div class="profile-info">
          <img class="profile-avatar" src="https://i.pravatar.cc/150?u=me" alt="avatar" />
          <h3>@my_profile</h3>
          <p style="color: #a1a1aa; font-size: 14px; margin-top: 5px;">QasinoTok әзірлеушісі</p>
          <div class="profile-stats">
            <div class="stat"><strong>12</strong><span>Жазылған</span></div>
            <div class="stat"><strong>1.2K</strong><span>Жазылушы</span></div>
            <div class="stat"><strong>45K</strong><span>Лайк</span></div>
          </div>
          <div class="profile-actions">
            <button class="btn-secondary">Профильді өңдеу</button>
          </div>
        </div>
      </section>
    </main>

    <!-- ТӨМЕНГІ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Басты</span>
      </button>
      <button class="nav-btn" data-page="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <span>Іздеу</span>
      </button>
      <button class="nav-btn nav-upload" data-page="upload">
        <span class="upload-plus">+</span>
      </button>
      <button class="nav-btn" data-page="messages">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>
        <span>Хабар</span>
      </button>
      <button class="nav-btn" data-page="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
        <span>Профиль</span>
      </button>
    </nav>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    // ==========================================
    // QASINOTOK — БІРІКТІРІЛГЕН JS
    // ==========================================

    // 1. ДЕМО ВИДЕОЛАР (Интернеттен тегін тест видеолары)
    const demoVideos = [
      {
        id: 1, author: "qasino_admin", avatar: "https://i.pravatar.cc/150?u=1",
        caption: "QasinoTok-қа қош келдіңіз! 🎉 #qasinotok #тренд",
        music: "Original Sound — QasinoTok", likes: 1200, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
      },
      {
        id: 2, author: "traveler_kz", avatar: "https://i.pravatar.cc/150?u=2",
        caption: "Таулардағы таңғы ас 🏔️ #табиғат #travel",
        music: "Sunrise — Chill Beats", likes: 850, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
      },
      {
        id: 3, author: "coder_life", avatar: "https://i.pravatar.cc/150?u=3",
        caption: "Код жазу — өнер! 💻 #coding #javascript",
        music: "Lo-Fi Coding — Beats", likes: 3400, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
      }
    ];

    // 2. ВИДЕОЛАРДЫ ШЫҒАРУ
    const videoFeed = document.getElementById('videoFeed');
    
    function renderFeed() {
      videoFeed.innerHTML = ''; 
      demoVideos.forEach((vid) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video src="${vid.videoUrl}" loop playsinline muted></video>
          <div class="video-overlay"></div>
          <div class="video-actions">
            <img src="${vid.avatar}" class="action-avatar" alt="avatar">
            <button class="action-btn like-btn" data-id="${vid.id}">
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span class="count">${vid.likes}</span>
            </button>
            <button class="action-btn comment-btn" data-id="${vid.id}">
              <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>
              <span class="count">0</span>
            </button>
            <button class="action-btn share-btn" data-id="${vid.id}">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              <span class="count">45</span>
            </button>
          </div>
          <div class="video-info">
            <div class="video-author">
              <img src="${vid.avatar}" alt="avatar" style="width:32px;height:32px;border-radius:50%;">
              <span class="author-name">@${vid.author}</span>
            </div>
            <div class="video-caption">${vid.caption}</div>
            <div class="video-music">
              <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span>${vid.music}</span>
            </div>
          </div>
        `;
        videoFeed.appendChild(card);
      });
      setupVideoObservers();
    }

    // 3. ВИДЕОЛАРДЫ АВТОМАТТЫ ОЙНАТУ (Скролл жасағанда)
    function setupVideoObservers() {
      const videos = document.querySelectorAll('.video-card video');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) {
            video.play().catch(() => {});
            videos.forEach(v => { if (v !== video) v.pause(); });
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.6 });
      videos.forEach(v => observer.observe(v));
    }

    // 4. БЕТТЕРДІ АУЫСТЫРУ (Навигация)
    const navBtns = document.querySelectorAll('[data-page]');
    const pages = document.querySelectorAll('.page');
    
    navBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const pageName = btn.getAttribute('data-page');
        if(!pageName) return;

        // Навигация батырмаларын тазалау
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const activeNav = document.querySelector(`.nav-btn[data-page="${pageName}"]`);
        if(activeNav) activeNav.classList.add('active');

        // Беттерді ауыстыру
        pages.forEach(p => p.classList.remove('active'));
        const targetPage = document.getElementById('page-' + pageName);
        if (targetPage) targetPage.classList.add('active');
      });
    });

    // 5. ЛАЙК ЖӘНЕ БӨЛІСУ БАТЫРМАЛАРЫ
    document.addEventListener('click', (e) => {
      const likeBtn = e.target.closest('.like-btn');
      if (likeBtn) {
        likeBtn.classList.toggle('liked');
        const countSpan = likeBtn.querySelector('.count');
        let count = parseInt(countSpan.innerText);
        countSpan.innerText = likeBtn.classList.contains('liked') ? count + 1 : count - 1;
        showToast(likeBtn.classList.contains('liked') ? 'Лайк басылды ❤️' : 'Лайк алынды');
      }

      const shareBtn = e.target.closest('.share-btn');
      if (shareBtn) {
        if (navigator.share) {
          navigator.share({ title: 'QasinoTok', url: window.location.href });
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast('Сілтеме көшірілді 🔗');
        }
      }

      const commentBtn = e.target.closest('.comment-btn');
      if (commentBtn) showToast('Пікірлер жақында қосылады 💬');
    });

    // 6. ХАБАРЛАМА (TOAST)
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 7. ЖҮКТЕУ БЕТІ
    document.getElementById('btnPickFile').addEventListener('click', () => {
      document.getElementById('videoFileInput').click();
    });
    document.getElementById('btnPublish').addEventListener('click', () => {
      showToast('Видео сәтті жарияланды! ✅');
      document.querySelector('[data-page="home"]').click(); // Басты бетке қайту
    });

    // 8. ІСКЕ ҚОСУ
    document.addEventListener('DOMContentLoaded', () => {
      renderFeed();
    });
  </script>
</body>
</html>
